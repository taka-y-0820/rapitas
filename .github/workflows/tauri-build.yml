name: Build Tauri App

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

env:
  RUST_BACKTRACE: full
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  BUN_LOCKFILE_SKIP: true  # Skip lockfile validation in CI
  NEXT_TURBO: 0  # Disable Turbopack globally in CI

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            rust_version: stable
            bunjs_version: '1.3.11'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            rust_version: stable
            bunjs_version: '1.3.11'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            rust_version: stable
            bunjs_version: '1.3.11'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            rust_version: stable
            bunjs_version: '1.3.11'

    runs-on: ${{ matrix.platform }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bunjs_version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust_version }}
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: './rapitas-desktop/src-tauri -> target'

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          bash scripts/install-ci-system-deps.sh \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfuse2 \
            file \
            desktop-file-utils \
            wget \
            curl \
            ca-certificates \
            zsync \
            squashfs-tools \
            libc6-dev \
            libgcc-s1

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Get pnpm store directory
        id: pnpm_cache_dir
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm_cache_dir.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --no-frozen-lockfile

      - name: Install desktop dependencies
        working-directory: rapitas-desktop
        run: pnpm install --no-frozen-lockfile

      # NOTE: the dual-client layout (generated/prisma-postgres +
      # generated/prisma-sqlite) means backend sources import the postgres
      # client with STATIC value imports; `bun build --compile` must be able
      # to resolve BOTH clients even though the desktop runtime picks sqlite
      # via resolvePrismaClientCtor. A dummy URL suffices — generate never
      # connects. Without this step the binary build fails on every platform
      # with `Could not resolve: "../generated/prisma-postgres"`.
      - name: Generate postgres Prisma Client (for static imports)
        working-directory: rapitas-backend
        run: bunx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Generate SQLite Prisma Client
        working-directory: rapitas-backend
        run: |
          echo "Generating SQLite Prisma Client for desktop build..."
          bun run db:prepare:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Build backend binary (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: rapitas-backend
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"
        run: |
          echo "Building full backend with Bun standalone compilation..."
          bun --version

          # Build full backend using index.ts
          bun build index.ts --compile --target bun-windows-x64 --outfile rapitas-backend.exe

          # Verify the build
          echo "Backend build complete. File details:"
          dir rapitas-backend.exe
          echo "Testing file existence..."
          if (Test-Path rapitas-backend.exe) { echo "✓ Backend binary exists" } else { echo "✗ Backend binary not found!" }

          # Create binaries directory and copy
          New-Item -ItemType Directory -Force -Path ../rapitas-desktop/src-tauri/binaries

          # Copy with platform-specific naming for Tauri sidecar
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            # Windows: Copy WITHOUT .exe extension - Tauri will add it automatically during bundling
            # This prevents double .exe extension (rapitas-backend.exe.exe)
            Copy-Item rapitas-backend.exe ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-pc-windows-msvc.exe
            # IMPORTANT: Copy as generic name WITHOUT .exe extension (matches tauri.conf.json)
            Copy-Item rapitas-backend.exe ../rapitas-desktop/src-tauri/binaries/rapitas-backend
          }

          # Bundle the Prisma query engine — bun's single-file compile cannot
          # embed .node native libraries and user machines have no node_modules,
          # so without this the installed backend dies at startup (the
          # PrismaClientInitializationError incident).
          Copy-Item generated/prisma-sqlite/*query_engine*.node ../rapitas-desktop/src-tauri/binaries/
          echo "Bundled Prisma engine(s):"
          Get-ChildItem ../rapitas-desktop/src-tauri/binaries/*query_engine* | Format-Table Name, Length

          echo "Backend binary copied to Tauri binaries directory"
          dir ../rapitas-desktop/src-tauri/binaries/

      # Boot the compiled exe from a clean directory WITHOUT node_modules so a
      # missing bundled Prisma engine (or any other packaging breakage) fails
      # HERE instead of on user machines — the installed-app "could not locate
      # the Query Engine" incident shipped because the binary was never booted
      # outside the repo checkout.
      - name: Smoke test backend binary (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: rapitas-backend
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "backend-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item rapitas-backend.exe (Join-Path $smokeDir "rapitas-backend.exe")
          # Mirror the installed layout: engine beside the exe + explicit path
          # (release.rs does the same at runtime).
          Copy-Item generated/prisma-sqlite/*query_engine*.node $smokeDir
          $engine = Get-ChildItem (Join-Path $smokeDir "*query_engine*.node") | Select-Object -First 1
          $env:PRISMA_QUERY_ENGINE_LIBRARY = $engine.FullName

          $env:RAPITAS_DB_PROVIDER = "sqlite"
          $env:DATABASE_URL = "file:$smokeDir\smoke.db"
          $env:RAPITAS_DATA_DIR = "$smokeDir"
          $env:PORT = "3199"
          $proc = Start-Process -FilePath (Join-Path $smokeDir "rapitas-backend.exe") -WorkingDirectory $smokeDir -PassThru -NoNewWindow

          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { Write-Host "Backend process exited early (code $($proc.ExitCode))"; break }
            $code = & curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:3199/categories
            if ($code -eq "200") { $ok = $true; break }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

          if (-not $ok) {
            Write-Host "::error::Backend smoke test FAILED - compiled binary did not serve GET /categories with 200"
            Get-ChildItem (Join-Path $smokeDir "logs") -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Tail 40 }
            exit 1
          }
          Write-Host "Backend smoke test passed (GET /categories -> 200)"

      - name: Build backend binary (Unix)
        if: matrix.platform != 'windows-latest'
        working-directory: rapitas-backend
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"
        run: |
          echo "Building full backend with Bun standalone compilation..."
          bun --version

          # Build full backend using index.ts
          if [ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]; then
            bun build index.ts --compile --target bun-linux-x64 --outfile rapitas-backend
          elif [ "${{ matrix.target }}" == "x86_64-apple-darwin" ]; then
            bun build index.ts --compile --target bun-darwin-x64 --outfile rapitas-backend
          elif [ "${{ matrix.target }}" == "aarch64-apple-darwin" ]; then
            bun build index.ts --compile --target bun-darwin-arm64 --outfile rapitas-backend
          else
            bun build index.ts --compile --outfile rapitas-backend
          fi

          # Verify the build
          echo "Backend build complete. File details:"
          ls -la rapitas-backend
          echo "File size: $(stat -c%s rapitas-backend 2>/dev/null || stat -f%z rapitas-backend) bytes"
          echo "File type: $(file rapitas-backend)"

          # Test if the binary runs
          echo "Testing backend binary..."
          # Don't test execution in CI - just verify file exists and is executable
          if [ -x ./rapitas-backend ]; then
            echo "✓ Backend binary is executable"
          else
            echo "✗ Backend binary is not executable"
            chmod +x ./rapitas-backend
            echo "Made backend binary executable"
          fi
          echo "Binary test completed"

          # Create binaries directory and copy
          mkdir -p ../rapitas-desktop/src-tauri/binaries

          # Copy with platform-specific naming for Tauri sidecar
          if [ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]; then
            cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu
            # IMPORTANT: Also copy as generic name that matches tauri.conf.json
            cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend
            # Verify copy was successful
            echo "Verifying Linux binary copy:"
            ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu
            ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend
          elif [ "${{ matrix.target }}" == "x86_64-apple-darwin" ]; then
            cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-apple-darwin
            # Also copy as generic name
            cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend
            echo "Verifying macOS x64 binary copy:"
            ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-apple-darwin
            ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend
          elif [ "${{ matrix.target }}" == "aarch64-apple-darwin" ]; then
            cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend-aarch64-apple-darwin
            # Also copy as generic name
            cp rapitas-backend ../rapitas-desktop/src-tauri/binaries/rapitas-backend
            echo "Verifying macOS ARM64 binary copy:"
            ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend-aarch64-apple-darwin
            ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend
          fi

          chmod +x ../rapitas-desktop/src-tauri/binaries/rapitas-backend*

          # Bundle the Prisma query engine — bun's single-file compile cannot
          # embed .node native libraries and user machines have no node_modules,
          # so without this the installed backend dies at startup.
          cp generated/prisma-sqlite/*query_engine*.node ../rapitas-desktop/src-tauri/binaries/
          echo "Bundled Prisma engine(s):"
          ls -la ../rapitas-desktop/src-tauri/binaries/*query_engine*

          echo "Backend binary copied to Tauri binaries directory"
          ls -la ../rapitas-desktop/src-tauri/binaries/

          # Extra verification for Linux
          if [ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]; then
            echo ""
            echo "Verifying Linux binary setup:"
            echo "Expected binary: rapitas-backend-x86_64-unknown-linux-gnu"
            if [ -f "../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu" ]; then
              echo "✓ Binary exists at expected path"
              echo "Size: $(stat -c%s ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu) bytes"
              echo "Permissions: $(ls -la ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu)"

              # Test that the binary is executable
              if [ -x "../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu" ]; then
                echo "✓ Binary is executable"
              else
                echo "✗ Binary is NOT executable - fixing permissions"
                chmod +x ../rapitas-desktop/src-tauri/binaries/rapitas-backend-x86_64-unknown-linux-gnu
              fi
            else
              echo "✗ Binary NOT found at expected path!"
              echo "Contents of binaries directory:"
              ls -la ../rapitas-desktop/src-tauri/binaries/ || echo "Directory not found"

              # Try to fix by looking for alternative names
              echo ""
              echo "Attempting to fix by finding alternative binary names..."
              if [ -f "../rapitas-desktop/src-tauri/binaries/rapitas-backend" ]; then
                echo "Found 'rapitas-backend' - this should already be in place"
                echo "✓ Generic binary exists"
              fi
            fi
          fi

      # Same packaging smoke test as Windows: boot the compiled binary outside
      # the repo (no node_modules) and require a 200 from a DB-backed route.
      - name: Smoke test backend binary (Unix)
        # Skip the x86_64-apple-darwin CROSS build: the macos runner is arm64, so
        # the smoke copies the runner's native arm64 Prisma query engine, which the
        # Intel binary can't load — it can never serve /categories. Only smoke the
        # NATIVE targets (ubuntu x86_64, macos aarch64).
        if: matrix.platform != 'windows-latest' && matrix.target != 'x86_64-apple-darwin'
        working-directory: rapitas-backend
        shell: bash
        run: |
          SMOKE_DIR="${RUNNER_TEMP}/backend-smoke"
          mkdir -p "$SMOKE_DIR"
          cp rapitas-backend "$SMOKE_DIR/rapitas-backend"
          # Mirror the installed layout: engine beside the exe + explicit path
          # (release.rs does the same at runtime).
          cp generated/prisma-sqlite/*query_engine*.node "$SMOKE_DIR/"
          ENGINE=$(ls "$SMOKE_DIR"/*query_engine*.node | head -1)
          cd "$SMOKE_DIR"

          PRISMA_QUERY_ENGINE_LIBRARY="$ENGINE" \
          RAPITAS_DB_PROVIDER=sqlite \
          DATABASE_URL="file:$SMOKE_DIR/smoke.db" \
          RAPITAS_DATA_DIR="$SMOKE_DIR" \
          PORT=3199 \
          ./rapitas-backend > smoke-stdout.log 2>&1 &
          BACKEND_PID=$!

          ok=0
          for _ in $(seq 1 30); do
            sleep 2
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Backend process exited early"
              break
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3199/categories || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
          done

          kill "$BACKEND_PID" 2>/dev/null || true

          if [ "$ok" != "1" ]; then
            echo "::error::Backend smoke test FAILED - compiled binary did not serve GET /categories with 200"
            echo "--- smoke-stdout.log (tail) ---"
            tail -n 60 smoke-stdout.log 2>/dev/null || true
            echo "--- backend log (tail) ---"
            tail -n 40 logs/backend-*.log 2>/dev/null || true
            exit 1
          fi
          echo "Backend smoke test passed (GET /categories -> 200)"

      - name: Build frontend
        working-directory: rapitas-frontend
        run: |
          echo "Building frontend with TAURI_BUILD=$TAURI_BUILD"
          echo "Current environment variables:"
          echo "NEXT_TURBO=$NEXT_TURBO"
          echo "TAURI_BUILD=$TAURI_BUILD"

          # Run Next.js build directly
          pnpm run build:tauri:ci

          # Run restore script
          node scripts/prepare-tauri-build.js restore

          # Check build output
          echo ""
          echo "Checking build output..."
          if [ -d "out" ]; then
            echo "✓ out directory exists with $(ls -1 out | wc -l) files"
            count=0
            for entry in out/* out/.[!.]* out/..?*; do
              [ -e "$entry" ] || continue
              echo "$entry"
              count=$((count + 1))
              [ "$count" -ge 10 ] && break
            done
          else
            echo "✗ out directory not found!"
            echo ""
            echo "Current directory contents:"
            ls -la
            echo ""
            echo "Checking .next directory:"
            if [ -d ".next" ]; then
              count=0
              for entry in .next/* .next/.[!.]* .next/..?*; do
                [ -e "$entry" ] || continue
                echo "$entry"
                count=$((count + 1))
                [ "$count" -ge 10 ] && break
              done
            fi
          fi
        shell: bash
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"
          NEXT_TELEMETRY_DISABLED: 1
          # Disable Turbopack for CI builds to avoid import resolution issues
          NEXT_TURBO: 0
          # Enable Tauri build mode for static export
          TAURI_BUILD: 'true'

      - name: Prepare desktop build (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: rapitas-desktop
        run: |
          pnpm run ci:prepare

          # Verify backend binary exists after build
          echo "Checking backend binary in binaries directory..."
          if (Test-Path "src-tauri/binaries") {
            Get-ChildItem "src-tauri/binaries" | Format-Table Name, Length
          } else {
            echo "binaries directory not found"
          }

      - name: Prepare desktop build (Unix)
        if: matrix.platform != 'windows-latest'
        working-directory: rapitas-desktop
        run: |
          pnpm run ci:prepare

          # Verify backend binary exists after build
          echo "Checking backend binary in binaries directory..."
          if [ -d "src-tauri/binaries" ]; then
            ls -la src-tauri/binaries/
          else
            echo "binaries directory not found"
          fi
        shell: bash

      - name: Verify backend binary before configuration (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: rapitas-desktop
        run: |
          echo "Checking binaries directory content before configuration:"
          if (Test-Path "src-tauri/binaries") {
            echo "Directory exists. Contents:"
            Get-ChildItem "src-tauri/binaries" | Format-Table Name, Length, LastWriteTime
            echo ""
            echo "Looking for expected binary: rapitas-backend-${{ matrix.target }}*"
            Get-ChildItem "src-tauri/binaries/rapitas-backend*" -ErrorAction SilentlyContinue | Format-Table Name, Length
            if ($LASTEXITCODE -ne 0) { echo "No rapitas-backend files found" }
          } else {
            echo "binaries directory does not exist!"
            echo "Creating binaries directory..."
            New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          }

      - name: Verify backend binary before configuration (Unix)
        if: matrix.platform != 'windows-latest'
        working-directory: rapitas-desktop
        run: |
          echo "Checking binaries directory content before configuration:"
          if [ -d "src-tauri/binaries" ]; then
            echo "Directory exists. Contents:"
            ls -la src-tauri/binaries/
            echo ""
            echo "Looking for expected binary: rapitas-backend-${{ matrix.target }}*"
            ls -la src-tauri/binaries/rapitas-backend* 2>/dev/null || echo "No rapitas-backend files found"
          else
            echo "binaries directory does not exist!"
            echo "Creating binaries directory..."
            mkdir -p src-tauri/binaries
          fi
        shell: bash

      - name: Prepare backend binary configuration
        working-directory: rapitas-desktop
        run: |
          # Run the script to prepare backend binary configuration
          node scripts/prepare-backend-binary.js ${{ matrix.target }}

          # Verify that the binary setup is correct
          echo ""
          echo "Final verification after prepare-backend-binary.js:"
          if [ -d "src-tauri/binaries" ]; then
            echo "Binaries directory contents:"
            ls -la src-tauri/binaries/
          else
            echo "ERROR: binaries directory does not exist!"
          fi

          # Check tauri.build.conf.json was updated
          echo ""
          echo "Checking tauri.build.conf.json externalBin configuration:"
          grep -A2 -B2 "externalBin" src-tauri/tauri.build.conf.json || echo "No externalBin found in config"
        shell: bash

      - name: Ensure binaries directory exists
        working-directory: rapitas-desktop
        shell: bash
        run: |
          # Ensure binaries directory exists before build
          if [ ! -d "src-tauri/binaries" ]; then
            mkdir -p src-tauri/binaries
            echo "Created binaries directory"
          else
            echo "Binaries directory already exists"
          fi

      # AppImage bundling disabled due to linuxdeploy compatibility issues in CI
      # Using deb and rpm packages instead for Linux distribution
      # - name: Prepare AppImage tools (Ubuntu)
      #   if: matrix.platform == 'ubuntu-latest'
      #   run: |
      #     echo "AppImage bundling is disabled - using deb/rpm instead"

      - name: Build Tauri application
        working-directory: rapitas-desktop
        shell: bash
        run: |
          # Build Tauri application with the correct target
          echo "Building Tauri app for ${{ matrix.platform }} (${{ matrix.target }})"
          if [ "${{ matrix.platform }}" == "ubuntu-latest" ]; then
            # AppImage requires linuxdeploy which is unavailable in CI runners.
            # Explicitly limit Linux bundles to deb and rpm only.
            echo "Bundle targets: deb, rpm (AppImage disabled — linuxdeploy not available in CI)"
            pnpm run build --target "${{ matrix.target }}" --bundles deb,rpm
          else
            pnpm run build --target "${{ matrix.target }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          DATABASE_URL: "postgresql://user:password@localhost:5432/rapitas?schema=public"  # Valid dummy URL for CI
          TARGET: ${{ matrix.target }}  # Pass target to build scripts

      - name: List build artifacts
        working-directory: rapitas-desktop
        run: |
          echo "Listing generated artifacts..."
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            # Use Windows cmd for dir command
            cmd /c "dir src-tauri\target\${{ matrix.target }}\release\bundle /s /b" || echo "No bundle files found"
          else
            find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name "*" 2>/dev/null || echo "No bundle files found"
          fi
        shell: bash

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rapitas-windows-${{ matrix.target }}
          # NOTE: *.sig files are required by the auto-updater so it can verify
          # downloads against the public key in tauri.conf.json.
          path: |
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rapitas-macos-${{ matrix.target }}
          path: |
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sig
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rapitas-linux-${{ matrix.target }}
          path: |
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sig
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            rapitas-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.sig

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Generate the updater manifest (latest.json) that the in-app updater
      # fetches from the GitHub release. The endpoint configured in
      # tauri.conf.json must match the URL of this file.
      - name: Generate updater manifest (latest.json)
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO_BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          read_sig() { [ -f "$1" ] && cat "$1" | base64 -w0 || echo ""; }

          WIN_EXE=$(find artifacts -name "*-setup.exe" | head -1 || true)
          WIN_SIG=$(find artifacts -name "*-setup.exe.sig" | head -1 || true)
          MAC_X64_DMG=$(find artifacts/rapitas-macos-x86_64-apple-darwin -name "*.dmg" 2>/dev/null | head -1 || true)
          MAC_X64_SIG=$(find artifacts/rapitas-macos-x86_64-apple-darwin -name "*.dmg.sig" 2>/dev/null | head -1 || true)
          MAC_ARM_DMG=$(find artifacts/rapitas-macos-aarch64-apple-darwin -name "*.dmg" 2>/dev/null | head -1 || true)
          MAC_ARM_SIG=$(find artifacts/rapitas-macos-aarch64-apple-darwin -name "*.dmg.sig" 2>/dev/null | head -1 || true)
          LINUX_DEB=$(find artifacts -name "*.deb" | head -1 || true)
          LINUX_SIG=$(find artifacts -name "*.deb.sig" | head -1 || true)

          cat > artifacts/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes on GitHub",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(read_sig "${WIN_SIG}")",
                "url": "${REPO_BASE}/$(basename "${WIN_EXE}" 2>/dev/null || echo missing.exe)"
              },
              "darwin-x86_64": {
                "signature": "$(read_sig "${MAC_X64_SIG}")",
                "url": "${REPO_BASE}/$(basename "${MAC_X64_DMG}" 2>/dev/null || echo missing.dmg)"
              },
              "darwin-aarch64": {
                "signature": "$(read_sig "${MAC_ARM_SIG}")",
                "url": "${REPO_BASE}/$(basename "${MAC_ARM_DMG}" 2>/dev/null || echo missing.dmg)"
              },
              "linux-x86_64": {
                "signature": "$(read_sig "${LINUX_SIG}")",
                "url": "${REPO_BASE}/$(basename "${LINUX_DEB}" 2>/dev/null || echo missing.deb)"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.sig
            artifacts/latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
