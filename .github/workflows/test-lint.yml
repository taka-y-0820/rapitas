name: Test and Lint

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

env:
  BUN_LOCKFILE_SKIP: true  # Skip lockfile validation in CI
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rapitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Setup test database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      - name: Run backend gate suite with coverage
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        # NOTE: File list is maintained in scripts/ci-gate-tests.txt (single source of truth).
        # To add/remove files, edit that manifest — do NOT modify this step.
        # See .github/TESTING_POLICY.md for the gate escalation path.
        run: bun run test:ci

      - name: Print backend coverage summary
        working-directory: rapitas-backend
        run: echo "Backend gate suite coverage printed above."

      - name: Evaluate workflow quality gates
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: bun run eval:gates

  # Advisory: runs the full test suite in parallel across OS processes.
  # continue-on-error: true — failures are visible in Step Summary but do NOT block merges.
  # See .github/TESTING_POLICY.md §"失敗ティア表" for the rationale.
  test-full-advisory:
    name: Full Suite (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: rapitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Setup test database
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      - name: Prepare SQLite client for isolated database tests
        working-directory: rapitas-backend
        env:
          DATABASE_URL: file:./isolated-tests.db
          RAPITAS_DB_PROVIDER: sqlite
        run: bun run db:generate:sqlite

      # Real browser processes must not compete with the parallel unit-test pool.
      - name: Verify application readiness in a real browser
        working-directory: rapitas-backend
        run: bun test --isolate services/agents/verification/runtime-smoke/runtime-readiness.test.ts

      - name: Run full test suite (parallel, advisory)
        working-directory: rapitas-backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/rapitas_test
          # NOTE: GitHub hosted runners provide 2 vCPUs; higher concurrency risks OOM/port conflicts.
          RAPITAS_TEST_CONCURRENCY: 2
        run: bun run test:parallel

      - name: Write failed files to Step Summary
        if: failure()
        working-directory: rapitas-backend
        run: |
          echo "## Full Suite Advisory — Failed Files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "These failures do **not** block the merge. Fix them to keep the advisory green." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bun run test:parallel 2>&1 | grep 'FAIL ' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  test-order-check:
    name: Test Order Dependency Check
    runs-on: ubuntu-latest
    # NOTE: continue-on-error keeps this job advisory (visibility only; does not block merges).
    # Escalation criterion: when `bun run test:shuffle` passes for 10 consecutive develop runs
    # with no seed-dependent failures, remove continue-on-error to enforce strict mode.
    # Track progress in the concerns backlog (label: test-order-flaky).
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Generate Prisma client
        working-directory: rapitas-backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: bunx prisma generate

      - name: Run tests in shuffled order
        working-directory: rapitas-backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TEST_SHUFFLE_SEED: ${{ github.run_number }}
        run: |
          echo "Shuffle seed: $TEST_SHUFFLE_SEED  (pass TEST_SHUFFLE_SEED=$TEST_SHUFFLE_SEED to reproduce)"
          bun run test:shuffle

  test-sqlite:
    name: Test SQLite Compatible Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Generate SQLite Prisma Client
        working-directory: rapitas-backend
        run: bun run db:prepare:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Run SQLite compatible tests
        working-directory: rapitas-backend
        run: bun run test:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

  check-frontend:
    name: Check Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Setup pnpm cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --no-frozen-lockfile

      - name: Setup Bun for frontend tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install frontend dependencies (bun)
        working-directory: rapitas-frontend
        run: bun install

      - name: Run TypeScript type check
        working-directory: rapitas-frontend
        run: pnpm tsc --noEmit

      - name: Run frontend gate tests
        working-directory: rapitas-frontend
        # NOTE: --coverage makes the vitest.config.ts threshold floor a real,
        # enforced gate (it was previously aspirational — coverage never ran in
        # CI). The floor is calibrated to THIS file list; keep them in sync.
        run: >
          bunx vitest run --coverage
          src/components/__tests__/AppIcon.test.tsx
          src/app/settings/developer-mode/components/AutoRunSettingsCard.test.tsx
          src/components/__tests__/ErrorBoundary.test.tsx
          src/components/__tests__/LanguageSwitcher.test.tsx
          src/components/copilot/__tests__/CopilotChatPanel.test.tsx
          src/feature/tasks/components/__tests__/TaskCard.test.tsx
          src/feature/tasks/components/timer/PomodoroTimer.test.tsx
          src/app/ideas/_components/__tests__/IdeaBoxHeader.test.tsx
          src/app/ideas/_components/__tests__/IdeasClient.test.tsx
          src/hooks/__tests__/useBackendHealth.test.ts
          src/hooks/__tests__/useDarkMode.test.ts
          src/hooks/__tests__/useDebounce.test.ts
          src/hooks/__tests__/useFilteredTasks.test.ts
          src/hooks/__tests__/useLocalStorageState.test.ts
          src/hooks/__tests__/useLoginForm.test.ts
          src/hooks/__tests__/useNotificationPreferences.test.ts
          src/hooks/__tests__/usePomodoroStats.test.ts
          src/hooks/__tests__/useSearchFilters.test.ts
          src/hooks/__tests__/useSplitView.test.ts
          src/hooks/__tests__/useTaskSearch.test.ts
          src/hooks/__tests__/useTaskSorting.test.ts
          src/hooks/__tests__/useWindowResize.test.ts
          src/hooks/__tests__/useWorkflowFiles.test.ts
          src/lib/__tests__/cache-utils.test.ts
          src/lib/__tests__/cache-warmup.test.ts
          src/lib/__tests__/logger.test.ts
          src/lib/__tests__/task-api.test.ts
          src/lib/__tests__/utils.test.ts
          src/lib/audio/__tests__/wav-codec.test.ts
          src/stores/__tests__/app-mode-store.test.ts
          src/stores/__tests__/execution-state-store.test.ts
          src/stores/__tests__/filter-data-store.test.ts
          src/stores/__tests__/locale-store.test.ts
          src/stores/__tests__/note-store.test.ts
          src/stores/__tests__/shortcut-store.test.ts
          src/stores/__tests__/task-cache-store.test.ts
          src/stores/__tests__/task-detail-visibility-store.test.ts
          src/stores/__tests__/ui-mode-store.test.ts
          src/stores/__tests__/server-restart-store.test.ts
          src/feature/terminal/__tests__/terminal-store.test.ts
          src/feature/terminal/__tests__/terminal-context-store.test.ts
          src/utils/__tests__/api.test.ts
          src/utils/__tests__/date.test.ts
          src/utils/__tests__/external-links.test.ts
          src/utils/__tests__/favicon.test.ts
          src/utils/__tests__/holidays.test.ts
          src/utils/__tests__/labels.test.ts
          src/utils/__tests__/notification.test.ts
          src/utils/__tests__/tauri.test.ts
          src/utils/__tests__/validation.test.ts
          src/feature/knowledge/hooks/__tests__/useContradictions.test.ts
          src/feature/knowledge/hooks/__tests__/useKnowledgeSearch.test.ts
          src/feature/developer-mode/components/__tests__/formatLogLine.test.ts
          src/feature/developer-mode/hooks/__tests__/execution-poll-handlers.test.ts
          src/feature/developer-mode/hooks/__tests__/execution-poll-terminal.test.ts
          src/feature/developer-mode/hooks/__tests__/execution-poll-loop.test.ts
          src/feature/tasks/components/gantt/gantt-utils.test.ts
          src/feature/tasks/hooks/__tests__/formatLogData.test.ts

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install backend dependencies
        working-directory: rapitas-backend
        run: bun install

      - name: Generate Prisma Client (needed for tsc)
        working-directory: rapitas-backend
        run: bunx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Install frontend dependencies
        working-directory: rapitas-frontend
        run: pnpm install --no-frozen-lockfile

      - name: Check backend TypeScript
        working-directory: rapitas-backend
        run: bunx tsc --noEmit

      - name: Check desktop SQLite Prisma generation
        working-directory: rapitas-backend
        run: bun run db:prepare:sqlite
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Verify SQLite generated artifacts match committed files
        working-directory: rapitas-backend
        run: |
          if ! git diff --exit-code prisma/schema.desktop/ src/generated/sqlite-init-sql.ts; then
            echo ""
            echo "ERROR: SQLite generated artifacts are out of sync with the Prisma schema."
            echo "Run 'bun run db:prepare:sqlite' in rapitas-backend/ and commit the regenerated files."
            exit 1
          fi

      - name: Check backend TypeScript with SQLite Prisma Client
        working-directory: rapitas-backend
        run: bunx tsc --noEmit
        env:
          RAPITAS_DB_PROVIDER: sqlite
          DATABASE_URL: "file:./rapitas-ci.db"

      - name: Check backend formatting
        working-directory: rapitas-backend
        run: bunx prettier --check "**/*.ts" --ignore-path .gitignore

      - name: Check boundary guide drift
        working-directory: rapitas-backend
        # NOTE: Verifies docs/boundary-guide.generated.md is in sync with
        # tests/helpers/boundary-values.ts. Run `bun run gen:boundary-guide` to fix.
        run: bun run check:boundary-guide

      - name: Check type-guard drift
        working-directory: rapitas-backend
        # NOTE: Verifies *.guards.generated.ts files are in sync with their SSOT sources.
        # Run `bun run gen:type-guards` to regenerate and commit the updated files.
        run: bun run check:type-guards

      - name: Check route barrel drift
        working-directory: rapitas-backend
        # NOTE: Verifies routes/<domain>/index.ts is in sync with
        # route-barrel-legacy-manifest.json + *.routes.ts auto-discovery.
        # Run `bun run generate:route-barrels` and commit the updated files.
        run: bun run generate:route-barrels:check

      - name: Check determinism guard (advisory)
        working-directory: rapitas-backend
        continue-on-error: true
        # NOTE: Advisory only — surfaces prompt-nondeterminism heuristics (unordered
        # findMany feeding a prompt, missing temperature, wall-clock/random in prompt
        # builders) without blocking merges. See scripts/check-determinism.cjs.
        run: bun run determinism:check

      - name: Lint frontend code
        working-directory: rapitas-frontend
        run: pnpm lint

      - name: Check frontend formatting
        working-directory: rapitas-frontend
        run: pnpm prettier --check "src/**/*.{ts,tsx,js,jsx,css,md}"

  rust-check:
    name: Check Rust Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './rapitas-desktop/src-tauri -> target'

      - name: Install system dependencies
        run: |
          bash scripts/install-ci-system-deps.sh \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Check Rust formatting
        working-directory: rapitas-desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: rapitas-desktop/src-tauri
        env:
          CI: true
        run: cargo clippy -- -D warnings

  rust-check-windows:
    name: Check Rust Code (Windows)
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './rapitas-desktop/src-tauri -> target'

      - name: Run Clippy
        working-directory: rapitas-desktop/src-tauri
        env:
          CI: true
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: rapitas-desktop/src-tauri
        env:
          CI: true
        run: cargo test --workspace
